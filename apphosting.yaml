# Firebase App Hosting config. Docs: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  runtime: nodejs22
  cpu: 1
  memoryMiB: 512
  concurrency: 100
  minInstances: 0
  maxInstances: 2

env:
  # --- Secrets (create with `firebase apphosting:secrets:set <NAME>`) ---
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability: [BUILD, RUNTIME]
  - variable: DIRECT_URL
    secret: DIRECT_URL
    availability: [BUILD, RUNTIME]
  - variable: NEXTAUTH_SECRET
    secret: NEXTAUTH_SECRET
    availability: [RUNTIME]

  # --- AskDepth Secrets (uncomment once created during manual onboarding smoke test) ---
  # Run `firebase apphosting:secrets:set <NAME>` and `firebase apphosting:secrets:grantaccess <NAME> --backend <BACKEND_ID>`
  # - variable: NEXT_PUBLIC_ASKDEPTH_WRITE_KEY
  #   secret: NEXT_PUBLIC_ASKDEPTH_WRITE_KEY
  #   availability: [BUILD, RUNTIME]
  # - variable: ASKDEPTH_DEPLOY_TOKEN
  #   secret: ASKDEPTH_DEPLOY_TOKEN
  #   availability: [BUILD]
  # - variable: ASKDEPTH_CONNECTOR_SECRET
  #   secret: ASKDEPTH_CONNECTOR_SECRET
  #   availability: [RUNTIME]

  # --- Plain values ---
  # Public URL of the app (custom domain).
  - variable: NEXTAUTH_URL
    value: https://demo-shop.askdepth.com
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_APP_URL
    value: https://demo-shop.askdepth.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_APP_NAME
    value: Demo Shop
    availability: [BUILD, RUNTIME]
  - variable: FORCE_HTTPS
    value: "true"
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_ASKDEPTH_ENDPOINT
    value: https://analytics-ingest-o2gbhvtrua-ew.a.run.app/v1/telemetry
    availability: [BUILD, RUNTIME]
  - variable: ASKDEPTH_INGEST_URL
    value: https://analytics-ingest-o2gbhvtrua-ew.a.run.app
    availability: [BUILD]
  - variable: NEXT_PUBLIC_ASKDEPTH_ENVIRONMENT
    value: production
    availability: [BUILD, RUNTIME]
  - variable: ASKDEPTH_REPOSITORY
    value: askdepth/demo-shop
    availability: [BUILD, RUNTIME]
